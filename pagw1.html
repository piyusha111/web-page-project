<!DOCTYPE html>
<html> 
<head>
        <title>landing page</title>
<style type="text/css">
        *{padding: 0; margin: 0;box-sizing: border-box;}
        header{
            width: 100%;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.2)), url('h.jpeg');
            background-size: cover;
            font-family: sans-serif;
        }
        nav{
            width: 100%;
            height: 100px;
            color: white;
            display:flex;
            justify-content: space-around;
            align-items: center;
            gap: 100px;


        }
        .logo {
             font-size: 2em;
             letter-spacing: 2px;
             padding-right: 500px;
                 
        }
        .audit a{
             
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 8px;
            background: indianred;

        }
        .h-txt{
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 650px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            text-align: center;
            color: white;
        }
        .h-txt span{
            letter-spacing: 3px;
            margin: 0;
             
             
        }
        .h-txt h1{
            font-size: 3.5em;
            margin: 0;
        }
        .h-txt a{
             
            text-decoration: none;
            background-color: indianred;
            color: white;
            padding: 10px 20px;
            letter-spacing: 5px;
            
        }



</style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                Spend-Smart
            </div>
            <div class="audit">
                <a href="#">Audit</a> <!--here we will add secomd page which to be opened-->
            </div>
        </nav>
        <section class="h-txt"> 
             <h1>Are you overpaying?</h1>
             <span> Enter your current subscriptions and get breakdown </span>  

             <br>
             <a href="#">Get your audit</a>

        </section>

    </header>

    </body>
    
    
</html>
